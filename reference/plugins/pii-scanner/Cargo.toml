# praxis-policy-plugin-pii-scanner — CMF plugin that detects PII patterns (SSN,
# credit card, email) in tool/prompt/resource args and either denies
# the call, taints the session, or redacts the matching values.

[package]
name = "praxis-policy-plugin-pii-scanner"
# Reference implementation. Not published, and not in the `builtins` umbrella:
# the detectors are plain regexes and the credit-card one does not Luhn-check
# (see `PiiPattern::CreditCard`), so shipping it as supported would invite
# operators to read "bundled PII scanner" as data-loss prevention. Real
# deployments want Presidio, a cloud DLP API, or their own detectors.
#
# Still a workspace member, so it is built, linted and tested here. A host
# registers it with `PolicyEngine::register_factory`; write your own against
# `praxis_policy_core::prelude`.
publish = false
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
description = "PPE CMF plugin — detects and redacts PII (SSN, credit card, email) in tool/prompt args."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
# A FIPS host disables defaults and enables `fips`.
default = ["crypto-rustcrypto"]
crypto-rustcrypto = ["praxis-policy-core/crypto-rustcrypto"]
fips = ["praxis-policy-core/fips"]

[dependencies]
praxis-policy-core = { workspace = true }

async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
regex       = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
