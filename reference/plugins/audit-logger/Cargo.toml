# praxis-policy-plugin-audit-logger — CMF plugin that emits a structured audit
# record for every dispatched request. Subject, client, action,
# delegation outcome, and capability-filtered context fields land
# in a single JSON line per call. Always allows; never blocks.

[package]
name = "praxis-policy-plugin-audit-logger"
# Reference implementation. Not published, and not in the `builtins` umbrella:
# the record shape is useful but the sink is stderr or `tracing::info!`, and a
# real deployment routes audit at a SIEM, a queue, or an append-only store.
# Shipping it as supported would mean versioning a stderr writer.
#
# Still a workspace member, so it is built, linted and tested here. A host
# registers it with `PolicyEngine::register_factory`; write your own against
# `praxis_policy_core::prelude`.
publish = false
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
description = "PPE CMF plugin — structured per-request audit logging."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
# A FIPS host disables defaults and enables `fips`.
default = ["crypto-rustcrypto"]
crypto-rustcrypto = ["praxis-policy-core/crypto-rustcrypto"]
fips = ["praxis-policy-core/fips"]

[dependencies]
praxis-policy-core = { workspace = true }

async-trait = { workspace = true }
chrono      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tracing     = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
