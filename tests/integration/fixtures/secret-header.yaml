#
# A secret-sourced assertion header, which the demo policies do not carry.
#
# The identity plugins match the demo's. Vault at https://vault.test holds
# the API key the upstream expects; `x-api-key` asserts it on every request
# and `strip:` withholds the user's raw token. `header-probe` reads request
# headers on both phases, so a test sees what a plugin is shown.

engine_settings:
  dispatch: policy

secrets:
  providers:
    vault:
      kind: vault
      address: https://vault.test
      allow_insecure_literal: true
      auth:
        method: approle
        role_id: ppe-tests
        secret_id:
          literal: approle-secret-id
  values:
    hr_api_key:
      provider: vault
      ref: secret/hr-mcp#api_key

plugins:
  - name: jwt-user
    capabilities: [perform_http]
    kind: identity/jwt
    hooks: [identity.resolve]
    mode: sequential
    on_error: fail
    config:
      role: user
      header: X-User-Token
      trusted_issuers:
        - issuer: "https://idp.test/realms/policy-demo"
          audiences: ["praxis-gateway"]
          algorithms: ["RS256"]
          decoding_key:
            kind: jwks_url
            url: "https://idp.test/realms/policy-demo/protocol/openid-connect/certs"
          leeway_seconds: 60
      claim_mapper: standard

  - name: jwt-client
    capabilities: [perform_http]
    kind: identity/jwt
    hooks: [identity.resolve]
    mode: sequential
    on_error: fail
    config:
      role: client
      header: Authorization
      trusted_issuers:
        - issuer: "https://idp.test/realms/policy-demo"
          audiences: ["praxis-gateway", "account"]
          algorithms: ["RS256"]
          decoding_key:
            kind: jwks_url
            url: "https://idp.test/realms/policy-demo/protocol/openid-connect/certs"
          leeway_seconds: 60
      claim_mapper: standard

  - name: header-probe
    kind: test/header-probe
    hooks: [cmf.tool_pre_invoke, cmf.tool_post_invoke]
    mode: sequential
    on_error: fail
    capabilities: [read_headers]

  - name: audit-log
    kind: audit/logger
    hooks: [cmf.tool_pre_invoke]
    mode: sequential
    on_error: ignore
    capabilities: [read_subject, read_client, read_meta]
    config:
      destination: tracing
      source: secret-header-fixture

global:
  authentication:
    - jwt-user
    - jwt-client
  assertions:
    request:
      headers:
        - name: x-api-key
          from: secret.hr_api_key
        - name: x-auth-user-id
          from: subject.id
          on_missing: deny
      strip:
        - x-user-token

routes:
  - tool: get_directory
    authorization:
      pre_invocation:
        - "require(role.hr)"
        - "run(header-probe)"
        - "run(audit-log)"
      post_invocation:
        - "run(header-probe)"
