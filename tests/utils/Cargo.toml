# praxis-policy-test-utils: shared harness for the integration, resilience and
# security suites under `tests/`.
#
# RustCrypto is explicit because this harness uses ordinary JWT fixtures.
# Builtins stay behind `suite` so the default workspace pass keeps them off.
# The lib is empty unless `suite` is on.
# The suites forward `suite`, which only the `make test` second pass enables.

[package]
name = "praxis-policy-test-utils"
description = "Shared test harness for the PPE integration, resilience and security suites."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

# No unit tests live here, so no lib-test or doctest binary is built.
[lib]
test = false
doctest = false

[features]
default = []
suite = [
  "praxis-policy/builtins",
  "praxis-policy/http-hyper",
  "praxis-policy-core/test-util",
  "dep:async-trait",
  "dep:base64",
  "dep:bytes",
  "dep:jsonwebtoken",
  "dep:rand",
  "dep:rsa",
  "dep:serde_json",
  "dep:serde_yaml",
  "dep:tokio",
  "dep:tracing",
]
# The experimental rate limiter, which `builtins` leaves out. Only
# the `make test` second pass turns it on, as with `suite`.
experimental-ratelimit = ["suite", "praxis-policy/experimental-ratelimit"]

[dependencies]
praxis-policy = { workspace = true }
praxis-policy-core = { workspace = true, features = ["crypto-rustcrypto"] }
praxis-policy-plugin-pii-scanner = { workspace = true }
praxis-policy-plugin-audit-logger = { workspace = true }

# Optional so the default pass resolves none of them; `suite` turns them on.
async-trait = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true, features = ["aws_lc_rs"] }
# Pinned to 0.8 for rsa 0.9's rand_core; see `crates/builtins/Cargo.toml`.
rand = { workspace = true, optional = true }
rsa = { workspace = true, optional = true, features = ["pem"] }
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[lints]
workspace = true
