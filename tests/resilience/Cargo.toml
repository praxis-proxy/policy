# praxis-policy-tests-resilience: Dependency failure and concurrency behavior of the full engine.
#
# Runs only in the `--all-features` pass. The one test target requires
# `suite`, which forwards to test-utils so the default pass builds nothing here
# and unifies no builtin features.

[package]
name = "praxis-policy-tests-resilience"
description = "PPE resilience test suite."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = []
suite = ["praxis-policy-test-utils/suite"]

# No features here: test-utils' `suite` turns on what these need.
[dev-dependencies]
praxis-policy-test-utils = { workspace = true }
praxis-policy = { path = "../../crates/ppe" }
praxis-policy-core = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }

[[test]]
name = "suite"
path = "tests/suite/main.rs"
required-features = ["suite"]

[lints]
workspace = true
