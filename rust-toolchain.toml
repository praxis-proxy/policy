# Pin the toolchain so local builds, CI, and the release pipeline agree. This
# version is also the project MSRV, mirrored in Cargo.toml `rust-version` and
# clippy.toml `msrv`. Bump all three together.

[toolchain]
channel = "1.96.0"
components = ["clippy", "rustfmt", "rust-analyzer", "llvm-tools-preview"]
