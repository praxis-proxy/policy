# praxis-policy-apl-cmf — bridge from praxis-policy-core typed extensions into praxis-policy-apl-core's
# AttributeBag. The "where the policy vocabulary comes from" crate.

[package]
name = "praxis-policy-apl-cmf"
description = "APL ↔ PPE bridge — extension → AttributeBag mapping"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
praxis-policy-apl-core = { workspace = true }
praxis-policy-core = { workspace = true }
serde_json = { workspace = true }
# `llm.system_prompt_digest`.
sha2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
# The compiler's test scaffolding. praxis-policy-apl-core is also a normal
# dependency, so cargo unifies the feature into this crate's non-test build too;
# that is accepted rather than worked around, since the feature adds one module
# and no behavior.
praxis-policy-apl-core = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
