# PPE Core — pure Rust plugin runtime with no FFI dependencies.
# Contains the PolicyEngine, 5-phase executor, hook registry,
# config parser, and all core types.

[package]
name = "praxis-policy-core"
description = "PPE plugin runtime core — PolicyEngine, executor, hooks, and config."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
# Test doubles for the seams a host normally fills — currently
# `http_testing::FakeTransport`.
#
# Off by default and never enabled by a normal build: a `FakeTransport`
# answers only what it was scripted with, so one reaching production
# would fail every outbound call, and identity failures are fail-closed.
# Keeping it behind a feature also keeps it out of the published API
# surface, where it would be bound by semver for no one's benefit.
#
# Downstream plugin authors testing against the `HttpTransport` seam
# enable it as a dev-dependency:
#
#     [dev-dependencies]
#     praxis-policy-core = { version = "0.1", features = ["test-util"] }
test-util = []

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
# Types for the outbound-HTTP seam (`http` module). Types only — no
# client, no runtime, no TLS. PPE never performs HTTP itself; a host
# installs an `HttpTransport`.
http = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
hashbrown = { workspace = true }
arc-swap = { workspace = true }
wildmatch = { workspace = true }
chrono = { workspace = true }
# Zeroizing wrapper for raw credential material in RawCredentialsExtension.
# `derive` feature pulls the proc-macro so we can `#[derive(Zeroize)]` on
# token-bearing structs in a future slice; for now only the
# `Zeroizing<String>` wrapper is used directly.
zeroize = { version = "1.9", features = ["zeroize_derive"] }
# Shared concurrency primitive used by `executor::run_concurrent_phase`
# (and praxis-policy-apl-core's `Effect::Parallel`). Leaf crate, no cycles back here.
praxis-policy-orchestration = { workspace = true }

[lints]
workspace = true
