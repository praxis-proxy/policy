# PPE Core — pure Rust plugin runtime with no FFI dependencies.
# Contains the PolicyEngine, 5-phase executor, hook registry,
# config parser, and all core types.

[package]
name = "praxis-policy-core"
description = "PPE plugin runtime core — PolicyEngine, executor, hooks, and config."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
hashbrown = { workspace = true }
arc-swap = { workspace = true }
wildmatch = { workspace = true }
chrono = { workspace = true }
# Zeroizing wrapper for raw credential material in RawCredentialsExtension.
# `derive` feature pulls the proc-macro so we can `#[derive(Zeroize)]` on
# token-bearing structs in a future slice; for now only the
# `Zeroizing<String>` wrapper is used directly.
zeroize = { version = "1.9", features = ["zeroize_derive"] }
# Shared concurrency primitive used by `executor::run_concurrent_phase`
# (and praxis-policy-apl-core's `Effect::Parallel`). Leaf crate, no cycles back here.
praxis-policy-orchestration = { workspace = true }

[lints]
workspace = true
