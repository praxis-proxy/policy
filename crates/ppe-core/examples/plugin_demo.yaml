# PPE Plugin Demo Configuration
#
# Four plugins under hook dispatch: each declares the hooks it fires
# at, and the two that must not fire everywhere narrow themselves with
# their own `conditions:`.
#
# This demo registers no APL visitor, so it has no `run(name)` step to
# invoke a plugin from — `dispatch: hooks` is what activates plugins
# here. `routes:`, `groups:`, and `global:` are load errors in this
# mode; a config that wants route- or tag-scoped activation writes a
# policy under `dispatch: policy` instead.

engine_settings:
  dispatch: hooks
  plugin_timeout: 30

plugins:
  # No `conditions:` — fires on every invocation of both hooks.
  - name: identity-resolver
    kind: builtin/identity
    hooks: [demo.tool_pre_invoke, demo.tool_post_invoke]
    mode: sequential
    priority: 10
    on_error: fail

  # Narrowed to the one PII-carrying tool. `tools:` matches
  # `meta.entity_name` exactly when `meta.entity_type` is `tool`.
  - name: pii-guard
    kind: builtin/pii
    hooks: [demo.tool_pre_invoke]
    mode: sequential
    priority: 20
    on_error: fail
    conditions:
      - tools: [get_compensation]
    config:
      clearance_level: confidential

  # Awaiting plugin — its `handle` body uses `.await` for a
  # (simulated) remote authz call on cache miss. Wired in exactly
  # the same way as plugins whose `handle` body has no `.await`;
  # registration is identical either way.
  - name: remote-authz
    kind: builtin/remote_authz
    hooks: [demo.tool_pre_invoke]
    mode: sequential
    priority: 30
    on_error: fail
    conditions:
      - tools: [query_external_data]

  - name: audit-logger
    kind: builtin/audit
    hooks: [demo.tool_pre_invoke, demo.tool_post_invoke]
    mode: fire_and_forget
    priority: 100
    on_error: ignore
