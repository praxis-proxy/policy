# praxis-policy-apl-runtime — the bridge between APL's evaluator (`praxis-policy-apl-core`) and PPE's
# runtime (`praxis-policy-core`). Provides per-hook-type implementations of
# `praxis-policy-apl-core::PluginInvoker` that translate APL plugin dispatch into typed
# `praxis-policy-core::PolicyEngine::invoke_named::<H>` calls.
#
# Design constraints inherited from `praxis-policy-apl-core`:
#   - `praxis-policy-apl-core` has zero PPE deps; cross-crate boundary lives here.
#   - The PluginInvoker trait is string-typed; the typed boundary lives
#     INSIDE each impl (one impl per HookTypeDef, e.g. CmfPluginInvoker
#     for CMF, future DelegationPluginInvoker for delegation hooks).
#   - Payload is built ONCE by the host and threaded through the invoker
#     for the full request lifetime — never reconstructed from the bag.

[package]
name = "praxis-policy-apl-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "APL ↔ PPE runtime bridge — per-hook PluginInvoker implementations."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
praxis-policy-apl-core = { workspace = true }
praxis-policy-apl-cmf = { workspace = true }
praxis-policy-core = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# Stable hash for tier-3 (identity-derived) session id. `DefaultHasher`
# is explicitly documented as not-stable-across-Rust-versions; session
# keys persist across process restarts (SessionStore), so we need an
# algorithmically fixed hash.
sha2 = "0.11"

[dev-dependencies]
serde = { workspace = true }
# See praxis-policy-apl-cmf's note: the feature unifies into the non-test build,
# which costs one module and no behavior.
praxis-policy-apl-core = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
