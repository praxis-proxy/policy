#
# A copy of the policy document the authpolicy transpiler emits, taken from
# `praxis-demos/demos/authpolicy-transpiler/e2e/out/jwt-cel-http-policy-doc.yaml`.
# It lives here because that repository is not on this workspace's dependency
# path, and it is copied rather than reduced so drift between the two is
# visible on inspection. Everything below the header is the emitted document
# verbatim.
#
# The shape that matters: a `global`-only policy with an `authentication:`
# list and an `authorization:` block, and no route at all. That is the known
# consumer of the entity-less HTTP policy, and it must resolve after the
# `http:` selector exists exactly as it did before.

# Generated by `authpolicy-transpiler` for policy `jwt-cel-http`.
# Authorization is emitted as the engine's `global` policy (canonical
# authentication/authorization block form). Because it declares only a
# `global` HTTP policy (no entity routes), Praxis authorizes it at the
# HTTP layer for generic (non-MCP) requests. Review the coverage report
# before use.
plugin_settings:
  routing_enabled: true
plugins:
- name: keycloak-jwt
  kind: identity/jwt
  hooks:
  - identity.resolve
  on_error: fail
  config:
    role: user
    header: Authorization
    trusted_issuers:
    - issuer: http://localhost:8081/realms/policy-demo
      algorithms:
      - RS256
      decoding_key:
        kind: jwks_url
        url: http://localhost:8081/realms/policy-demo/protocol/openid-connect/certs
        insecure_http: true
    claim_mapper: standard
global:
  authentication:
  - keycloak-jwt
  authorization:
    pre_invocation:
    - require(authenticated)
    - cel:
        expr: '!((http.path.startsWith(''/api''))) || (!((http.method == ''GET'')) || (((has(perm.tool_execute) && perm.tool_execute))))'
    - cel:
        expr: '!((http.path.startsWith(''/api''))) || (!(((http.method == ''POST'') || (http.method == ''DELETE''))) || (((has(role.hr) && role.hr))))'
  pdp:
  - kind: cel
