# Signs the jwt_fips fixtures with RustCrypto, so no OpenSSL code produces a
# signature the suite verifies. Standalone: not a workspace member.

[package]
name = "jwt-fips-fixtures"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "pem", "rand_core"] }
p256 = { version = "0.13.2", features = ["ecdsa", "pem"] }
p384 = { version = "0.13.1", features = ["ecdsa", "pem"] }
rand = "0.8.5"
rsa = { version = "0.9.10", features = ["sha2"] }
serde_json = "1.0.145"
sha2 = { version = "0.10.9", features = ["oid"] }
