# APL core — predicate language, compiler, evaluator.
# The grammar this crate accepts is normative in docs/apl-grammar.md.

[package]
name = "praxis-policy-apl-core"
description = "APL — Authorization Policy Language core (compiler + evaluator)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[package.metadata.cargo-machete]
# serde is used through its derive macros (Serialize/Deserialize), which
# cargo-machete's source scan does not reliably detect. It is a real dependency.
ignored = ["serde"]

[lib]
# Plain rlib; APL is consumed by other workspace crates (praxis-policy-apl-cmf, praxis-policy-apl-runtime)
# and does not need cdylib for FFI.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
futures = { workspace = true }
praxis-policy-orchestration = { workspace = true }

[features]
# Scaffolding for compiling one policy block plus its plugin registry, which is
# what this crate's tests and those of praxis-policy-apl-cmf and
# praxis-policy-apl-runtime need from the compiler.
#
# Off by default and never enabled by a normal build. Keeping it behind a feature
# keeps a test seam out of the published API surface, where semver would bind it
# for no consumer's benefit. The rationale is praxis-policy-core's `test-util`
# feature's, verbatim.
#
# This crate's own `tests/` need it too, and cargo does not enable a crate's own
# optional feature for `cargo test`, hence the self dev-dependency below rather
# than a `required-features` test target: such a target is silently skipped
# instead of run, which is the failure mode this work exists to remove.
test-util = []

[dev-dependencies]
tokio = { workspace = true }
# Path-only rather than `workspace = true`, because the workspace entry carries a
# version requirement and a self dev-dependency cannot satisfy one: at package
# time cargo resolves the requirement against the registry, where this version
# does not exist yet, so `cargo package` fails before anything is uploaded.
# Cargo drops a dev-dependency that names no version from the published manifest,
# which is correct here: no consumer builds this crate's tests.
praxis-policy-apl-core = { path = ".", features = ["test-util"] }

[lints]
workspace = true
