name: Release

# Publishes every workspace crate to crates.io when a `vX.Y.Z` tag is pushed.
#
# The local release flow (`make release`) stops at the tag deliberately, so this
# workflow is the only thing that publishes. Pushing the tag is the act of
# releasing.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-verify-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-release-verify-
      - run: make lint
      - run: make test
      # Proves every publishable crate packages cleanly before anything is
      # uploaded. A failure here is recoverable; a half-published workspace is
      # not, because crates.io versions are immutable.
      - run: cargo package --workspace --locked

  tag-matches-manifest:
    name: tag matches manifest version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Compare
        # The tag name reaches a shell here, so it goes through the environment
        # rather than being interpolated into the script.
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          manifest_version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          tag_version="${TAG_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "tag $tag_version does not match manifest version $manifest_version"
            exit 1
          fi

  publish:
    name: publish to crates.io
    needs: [verify, tag-matches-manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    environment: crates-io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-publish-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-release-publish-
      # Dependency order, skipping anything already on crates.io and waiting out
      # the registry's new-crate rate limit.
      #
      # Not `cargo publish --workspace`: that command cannot finish a release with
      # more new crates than the rate-limit burst allows, and a version cannot be
      # deleted once uploaded. Its failure mode is a permanently half-published
      # release. The script is idempotent, so this job can be re-run, and it does
      # not collide with a release that was published by hand.
      - name: Publish
        # A rate-limited first release waits ~10 minutes per crate beyond the
        # burst, so allow well past the 6h default rather than dying mid-run.
        timeout-minutes: 300
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: tools/publish.sh
