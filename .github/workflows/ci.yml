name: CI

# Every `uses:` is SHA-pinned and GitHub-owned. This repository sets
# `sha_pinning_required` and restricts allowed actions to GitHub-owned, verified
# creators, and `dtolnay/rust-toolchain@*`. A tag reference such as `@v4`, or a
# third-party action outside that list, fails the run before any job starts, and
# it presents as a workflow file problem rather than a build failure.
#
# The consequence is that helper actions are replaced by the commands underneath
# them: caching uses actions/cache directly, and cargo tools install themselves
# through the Makefile, which already does that locally.
#
# No toolchain action is needed. rust-toolchain.toml pins the channel and its
# components, and rustup installs from that file on the first cargo invocation,
# so the toolchain stays declared in exactly one place.
#
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-24.04
    # Raised from 15 for clippy across the expanded default feature set.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-lint-
      - run: make lint

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - run: make test

  doc:
    name: docs build
    runs-on: ubuntu-24.04
    # Raised from 15 to document the expanded default feature set.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-doc-
      - run: make doc

  check-features:
    name: per-feature check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-check-features-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-check-features-
      # `make ci` is not what CI runs — the jobs here invoke targets directly —
      # so the per-feature gate needs its own job or it never executes.
      - run: make check-fips-graph
      # No FIPS provider here: checks reports, refusals and fail-closed hashing.
      - run: make test-fips-no-provider
      - run: make check-features

  fips-provider-tests:
    name: FIPS provider tests
    runs-on: ubuntu-24.04
    container:
      # Match the UBI 9 OpenSSL provider used by the Praxis FIPS test setup.
      image: registry.access.redhat.com/ubi9/ubi@sha256:a4b9ec09b1e790a53ef25b7777c539976abe519248264298e5194dcbceac8c31
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Install Git for checkout
        run: dnf install -y git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenSSL FIPS provider and Rust build tools
        run: |
          set -euo pipefail
          dnf install -y \
            cmake gcc gcc-c++ make openssl openssl-devel \
            openssl-fips-provider-so perl-core pkgconf-pkg-config
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Verify the FIPS provider is active
        env:
          OPENSSL_CONF: ${{ github.workspace }}/.github/fips-provider.cnf
        run: |
          set -euo pipefail
          openssl list -providers
          printf '' | openssl dgst -sha256 -propquery 'fips=yes'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-fips-provider-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-fips-provider-
      - name: Run FIPS tests with the provider enabled
        run: make test-fips-provider
        env:
          OPENSSL_CONF: ${{ github.workspace }}/.github/fips-provider.cnf
          PRAXIS_REQUIRE_FIPS_PROVIDER: "1"

  release-readiness:
    name: packaging + publish order
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-readiness-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-release-readiness-
      # Nothing outside a tagged release used to exercise either of these, which
      # is how the publish order drifted for a whole release cycle without
      # anyone noticing. Both are cheap and neither uploads anything.
      # The unpublished test crates depend on local-only reference plugins.
      # Verification against crates.io happens only after sibling versions
      # publish; the workspace checks above compile them together here.
      - run: >-
          cargo package --workspace
          --exclude praxis-policy-test-utils
          --exclude praxis-policy-tests-integration
          --exclude praxis-policy-tests-resilience
          --exclude praxis-policy-tests-security
          --locked --no-verify
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-package-target
      - run: tools/publish.sh --dry-run
      # The re-export paths all changed, so this is the check most likely to
      # surprise at tag time. It runs here as well as in release.yaml.
      - run: make semver-facade
