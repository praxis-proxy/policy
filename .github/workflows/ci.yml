name: CI

# Every `uses:` is SHA-pinned and GitHub-owned. This repository sets
# `sha_pinning_required` and restricts allowed actions to GitHub-owned, verified
# creators, and `dtolnay/rust-toolchain@*`. A tag reference such as `@v4`, or a
# third-party action outside that list, fails the run before any job starts, and
# it presents as a workflow file problem rather than a build failure.
#
# The consequence is that helper actions are replaced by the commands underneath
# them: caching uses actions/cache directly, and cargo tools install themselves
# through the Makefile, which already does that locally.
#
# No toolchain action is needed. rust-toolchain.toml pins the channel and its
# components, and rustup installs from that file on the first cargo invocation,
# so the toolchain stays declared in exactly one place.
#
# `make lint` formats with nightly rustfmt, which that file cannot declare: it
# pins one channel and nightly is a second. The lint job installs it explicitly,
# so a job running `make lint` or `make fmt` needs that step.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-24.04
    # Raised from 15: `make lint` gained an --all-features clippy pass, which
    # lints the bundled extensions that a default-feature run skips.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-lint-
      # `make lint` runs rustfmt from nightly, which rust-toolchain.toml does
      # not cover. Without this the job fails on a missing cargo-fmt before it
      # lints anything.
      - run: rustup toolchain install nightly --component rustfmt --profile minimal
      - run: make lint

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - run: make test

  doc:
    name: docs build
    runs-on: ubuntu-24.04
    # Raised from 15: `make doc` gained an --all-features pass, which documents
    # the bundled extensions that a default-feature run compiles none of.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-doc-
      - run: make doc

  check-features:
    name: per-feature check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-check-features-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-check-features-
      # `make ci` is not what CI runs — the jobs here invoke targets directly —
      # so the per-feature gate needs its own job or it never executes.
      - run: make check-features
