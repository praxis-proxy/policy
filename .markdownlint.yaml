# Markdown rules for this repository: 80-column prose, with code blocks
# following the 120-char code limit. Run with `make docs-lint`.

# MD013: 80-column prose; code blocks follow the 120-char code limit
MD013:
  line_length: 80
  code_block_line_length: 120
  tables: false

# MD040: fenced code blocks must declare a language (never bare backticks)
MD040: true

# MD034: no bare URLs
MD034: true

# MD024: repeated headings are fine across sections
MD024:
  siblings_only: true

# MD049: consistent emphasis marker
MD049:
  style: asterisk

# MD028: stacked blockquotes are intentional style
MD028: false

# MD041: GitHub templates render inside a page and start at h2
MD041: false

# MD033: tables sometimes need inline HTML
MD033: false

# MD060: table pipes need not align. No file in this repository has ever
# aligned them, and reformatting every table to satisfy a style nobody
# writes by hand would be churn with no reader benefit.
MD060: false

# MD036: bold labels are used deliberately where a heading would be wrong,
# for the "Covers" / "Does not cover" pairs under a placement in the threat
# model. They label a paragraph; they are not sections to navigate to.
MD036: false

# MD046: an indented block is fine where a fence would break the flow, as in
# the repository layout sketch in the README.
MD046: false
