# praxis-policy-plugin-delegator-oauth — `TokenDelegateHandler` that performs RFC 8693
# OAuth 2.0 token exchange against any compliant IdP.
#
# # Why this exists
#
# Slice 3's `TokenDelegateHook` defines the surface (`DelegationPayload`
# in, `RawDelegatedToken` out via `apply_to_extensions`); this crate
# is the *backend* — the part that actually mints the downstream
# credential. The IdP-mediated path: POST to the IdP's `/token`
# endpoint with `grant_type=urn:ietf:params:oauth:grant-type:token-exchange`,
# parse the JSON response, build a `RawDelegatedToken`.
#
# # When to reach for this vs a Biscuit delegator
#
# - **`praxis-policy-plugin-delegator-oauth`** (this crate) — IdP-mediated. Use when
#   the deployment already runs an OAuth server (Keycloak, Auth0,
#   Hydra, Zitadel, Janssen Jans Auth Server) and wants centralized
#   audit/revocation. Every delegation costs an IdP roundtrip;
#   gateway must hold IdP client credentials.
# - **a Biscuit delegator** — decentralized capability tokens via biscuit
#   attenuation. No IdP roundtrip. Use for federated agent ecosystems where
#   there is no shared IdP. Not implemented here.
#
# Any delegator implements `HookHandler<TokenDelegateHook>`, so they are
# swappable at config time.

[package]
name = "praxis-policy-plugin-delegator-oauth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "PPE delegation handler — RFC 8693 OAuth 2.0 token exchange."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
praxis-policy-core = { workspace = true }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

# `base64` decodes the minted token's JWT payload for a best-effort,
# read-only interop check (did the IdP honor the RFC 8693 `actor_token`
# and emit an `act` claim). We never verify the signature here — the
# token is already trusted, having just come from our own IdP roundtrip.
base64 = "0.22"

# Secret-clearing wrapper for client credentials in memory.
zeroize = { version = "1.9", features = ["zeroize_derive"] }

# Cache-key derivation: HMAC-SHA256 under a per-process secret, so a key
# is safe to log and a caller who controls the anchor bytes still cannot
# steer the output.
#
# Deliberately not blake3, which is the obvious pick for a keyed hash.
# `sha2` is already in the tree, and with it `digest`, `crypto-common`,
# `subtle`, `typenum`, `generic-array` and `block-buffer` — so `hmac`
# adds one crate and nothing transitive, where blake3 brings a new tree.
# Its speed advantage is real and irrelevant at this size: one hash of a
# couple of kilobytes per delegation, against an IdP round trip.
#
# Pinned to 0.12 rather than 0.13 for the same reason: 0.13 pairs with
# `digest` 0.11 and would pull a second `sha2` alongside the existing one.
hmac = "0.12"
sha2 = "0.10"

# 32 bytes for the per-process HMAC secret. Already in the tree
# transitively; named here because the cache needs it directly.
getrandom = "0.3"

# The bounded, coalescing store behind the delegated-token cache.
#
# Two of its guarantees are acceptance criteria rather than conveniences,
# which is why this is a dependency instead of a few hundred lines here.
# `try_get_with` "guarantees that concurrent calls on the same
# not-existing key are coalesced into one evaluation", so N concurrent
# requests for one uncached key produce one exchange. And on `Err` it
# "does not insert a value", so a failed or indeterminate mint cannot be
# cached even by mistake.
#
# The alternative shape, a `HashMap<Key, Arc<Mutex<()>>>` guarding a
# separate map, is what `oauth2-broker` does; its guard map is only ever
# inserted into, never pruned, so the structure protecting the cache
# grows without the bound that protects the cache. moka's coalescing
# lives inside the bounded map, so `max_entries` covers both.
moka = { version = "0.12", features = ["future"] }

[dev-dependencies]
# The `HttpTransport` test double. A dev-dependency so the feature is
# enabled for test builds only; resolver 3 keeps it out of the normal
# build of this crate.
praxis-policy-core = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
# `HttpResponse::new` takes `Bytes`, so a test transport that builds its
# own responses needs the type by name. Already in the tree.
bytes = { workspace = true }

[lints]
workspace = true
