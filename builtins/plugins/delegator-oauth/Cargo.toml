# praxis-policy-plugin-delegator-oauth — `TokenDelegateHandler` that performs RFC 8693
# OAuth 2.0 token exchange against any compliant IdP.
#
# # Why this exists
#
# Slice 3's `TokenDelegateHook` defines the surface (`DelegationPayload`
# in, `RawDelegatedToken` out via `apply_to_extensions`); this crate
# is the *backend* — the part that actually mints the downstream
# credential. The IdP-mediated path: POST to the IdP's `/token`
# endpoint with `grant_type=urn:ietf:params:oauth:grant-type:token-exchange`,
# parse the JSON response, build a `RawDelegatedToken`.
#
# # When to reach for this vs a Biscuit delegator
#
# - **`praxis-policy-plugin-delegator-oauth`** (this crate) — IdP-mediated. Use when
#   the deployment already runs an OAuth server (Keycloak, Auth0,
#   Hydra, Zitadel, Janssen Jans Auth Server) and wants centralized
#   audit/revocation. Every delegation costs an IdP roundtrip;
#   gateway must hold IdP client credentials.
# - **a Biscuit delegator** — decentralized capability tokens via biscuit
#   attenuation. No IdP roundtrip. Use for federated agent ecosystems where
#   there is no shared IdP. Not implemented here.
#
# Any delegator implements `HookHandler<TokenDelegateHook>`, so they are
# swappable at config time.

[package]
name = "praxis-policy-plugin-delegator-oauth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "PPE delegation handler — RFC 8693 OAuth 2.0 token exchange."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
praxis-policy-core = { workspace = true }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

# `base64` decodes the minted token's JWT payload for a best-effort,
# read-only interop check (did the IdP honor the RFC 8693 `actor_token`
# and emit an `act` claim). We never verify the signature here — the
# token is already trusted, having just come from our own IdP roundtrip.
base64 = "0.22"

# Secret-clearing wrapper for client credentials in memory.
zeroize = { version = "1.9", features = ["zeroize_derive"] }

[dev-dependencies]
# The `HttpTransport` test double. A dev-dependency so the feature is
# enabled for test builds only; resolver 3 keeps it out of the normal
# build of this crate.
praxis-policy-core = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
