# praxis-policy-plugin-identity-api-key — API key `IdentityResolveHandler`.
#
# An API key carries nothing, so authenticating one is a lookup: find the
# record keyed by this credential and project its fields onto the identity
# slots. The projection is the shared mapper in praxis-policy-core, the same
# one the JWT plugin runs, so a policy reading `subject.roles` cannot tell
# which credential produced them.
#
# The file backend needs no network stack, which is why this stays in the
# workspace's default-members.

[package]
name = "praxis-policy-plugin-identity-api-key"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "PPE identity handler — API key directory lookup and record projection."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
praxis-policy-core = { workspace = true }

# `chrono` for the `expires_at` comparison. A record's expiry is enforced here
# when it carries one, because on the file path nothing else is positioned to.
chrono = { workspace = true }

# `sha2` for the hash index. Keys are compared by digest, never in plaintext.
sha2 = "0.11"

# `zeroize` to clear the presented credential on drop.
zeroize = { version = "1.9", features = ["zeroize_derive"] }

# `arc-swap` so a refresh publishes a new record set without a lock on the
# lookup path.
arc-swap = { workspace = true }

async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The `HttpTransport` test double, so the HTTP backend's cases run in process
# with no socket. A dev-dependency, so resolver 3 keeps the feature out of a
# normal build of this crate.
praxis-policy-core = { workspace = true, features = ["test-util"] }
sha2 = "0.11"

[lints]
workspace = true
