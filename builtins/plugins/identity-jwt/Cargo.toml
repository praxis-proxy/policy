# praxis-policy-plugin-identity-jwt — JWT-based `IdentityResolveHandler`.
#
# Validates inbound JWTs against configured trusted issuers
# (signature + exp + aud + iss claims) and maps the validated claims
# into `SubjectExtension` / `ClientExtension` via a configurable
# claim-mapper. The raw token is stashed in
# `RawCredentialsExtension.inbound_tokens` for forwarding plugins
# downstream.
#
# Lightweight (~5-15 transitive deps), so it stays in the workspace's
# default-members.

[package]
name = "praxis-policy-plugin-identity-jwt"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "PPE identity handler — JWT validation and claim mapping."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
praxis-policy-core = { workspace = true }

# `jsonwebtoken` is the de facto JWT library for Rust. Supports
# RS256/RS384/RS512, ES256/ES384, EdDSA, HS256/HS384/HS512. Default
# features include `use_pem` (load DecodingKey from PEM strings) which
# we want. v10 split out the crypto backend into a required feature
# (neither `rust_crypto` nor `aws_lc_rs` is on by default) and panics
# at first sign/verify if none is selected. We pick `aws_lc_rs`: the
# alternative, `rust_crypto`, pulls the pure-Rust `rsa` crate as a
# runtime dependency, and that crate carries RUSTSEC-2023-0071 (Marvin
# timing sidechannel) with no fixed release — which then propagates the
# advisory to every downstream consumer of this plugin. aws-lc-rs keeps
# `rsa` out of the runtime tree at the cost of a C/cmake build step.
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }

# `base64` for the peek-at-iss helper (split + URL_SAFE_NO_PAD decode
# of the middle JWT segment). Pinned to 0.22 to match what
# jsonwebtoken 9 pulls — Cargo dedups to a single version.
base64 = "0.22"

# `chrono` for the `resolved_at` timestamp on IdentityPayload. Comes
# in transitively via praxis-policy-core already; redeclaring keeps the
# direct-dep relationship visible.
chrono = { workspace = true }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# `futures::join_all` so multiple resolvers' JWKS endpoints fetch
# concurrently at initialize time rather than one-at-a-time.
futures = { workspace = true }

# `tokio::spawn` + `tokio::time::interval` for the background JWKS
# refresh tasks. The runtime is already in the workspace dep tree via
# praxis-policy-core / praxis-policy-apl-runtime, so this only makes the existing
# types directly nameable here. Only `rt` and `time` are needed at runtime; the
# dev-dependency below adds what the tests use.
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
# The `HttpTransport` test double. A dev-dependency so the feature is
# enabled for test builds only; resolver 3 keeps it out of the normal
# build of this crate.
praxis-policy-core = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# RSA keypair + JWK fixtures for tests. `rsa` generates keypairs;
# `pkcs8` encodes them in the PEM format jsonwebtoken accepts.
rsa = { version = "0.9", features = ["pem"] }
# rsa 0.9's `RsaPrivateKey::new(&mut rng, bits)` takes an rng
# implementing `rand_core::CryptoRngCore` — `rand::thread_rng()`
# satisfies that. Pinned to 0.8: rsa 0.9 (latest stable) depends on
# rand_core 0.6, which rand 0.9 (rand_core 0.9) no longer implements,
# so the two are incompatible until rsa 0.10 ships. Test-only dep.
rand = "0.8"

[lints]
workspace = true
