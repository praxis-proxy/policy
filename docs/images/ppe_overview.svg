  <line x1="1398" y1="330" x2="1525" y2="330" stroke="#8d8d8d" stroke-width="5" stroke-dasharray="3 9" stroke-linecap="round"/>
  <circle cx="1378" cy="330" r="9" fill="#8d8d8d"/>

  <!-- what it forwards to -->
  <line x1="905" y1="521" x2="905" y2="591" stroke="#8d8d8d" stroke-width="5" marker-end="url(#ah)"/>
  <text x="940" y="571" font-size="33" fill="#161616">forward or block</text>
  <rect x="470" y="601" width="870" height="95" rx="8" fill="#f5f5f5"/>
  <text x="905" y="661" font-size="38" fill="#161616" text-anchor="middle">tools &#183; agents &#183; models &#183; resources</text>
