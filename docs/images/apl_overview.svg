<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2060 970" font-family="IBM Plex Sans">
  <rect width="2060" height="970" fill="#ffffff"/>

  <!-- code panel -->
  <rect x="30" y="30" width="720" height="910" rx="10" fill="#f5f5f5"/>

  <!-- highlights: the phases and the field blocks -->
  <rect x="90" y="318" width="620" height="252" rx="6" fill="#e2eef0"/>
  <rect x="90" y="574" width="620" height="124" rx="6" fill="#d7e7ea"/>

  <!-- sketch: indentation is an x offset per line, so no renderer has to
       preserve leading whitespace for the YAML shape to read -->
  <g font-family="IBM Plex Mono" font-size="22" fill="#161616">
    <text x="70" y="86">plugins: …</text>
    <text x="70" y="150">global:</text>
    <text x="96" y="182">authentication: [jwt-user]</text>
    <text x="70" y="246">routes:</text>
    <text x="96" y="278">- tool: get_compensation</text>
    <text x="123" y="310">authorization:</text>
    <text x="149" y="342">pre_invocation:</text>
    <text x="176" y="374">- require(role.hr)</text>
    <text x="176" y="406">- cedar: {…}</text>
    <text x="176" y="438">- delegate(workday-oauth,</text>
    <text x="228" y="470">permissions: [read_compensation])</text>
    <text x="176" y="502">- taint(secret, session)</text>
    <text x="149" y="534">post_invocation:</text>
    <text x="176" y="566">- run(audit-log)</text>
    <text x="123" y="598">args:</text>
    <text x="149" y="630">ssn: str | mask(4)</text>
    <text x="123" y="662">result:</text>
    <text x="149" y="694">ssn: str | redact(!perm.view_ssn)</text>
    <text x="96" y="758">- tool: send_email</text>
    <text x="123" y="790">authorization:</text>
    <text x="149" y="822">pre_invocation:</text>
    <text x="176" y="854">- require(perm.email_send)</text>
    <text x="176" y="886">- security.labels contains</text>
    <text x="228" y="918">"secret": deny</text>
  </g>

  <!-- leaders + labels -->
  <g stroke="#35a3ab" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round">
    <line x1="214" y1="78" x2="800" y2="78"/>
    <line x1="174" y1="142" x2="800" y2="142"/>
    <line x1="174" y1="238" x2="800" y2="238"/>
    <line x1="359" y1="334" x2="800" y2="334"/>
    <line x1="372" y1="526" x2="800" y2="526"/>
    <line x1="720" y1="638" x2="800" y2="638"/>
    <line x1="531" y1="878" x2="800" y2="878"/>
  </g>
  <g fill="#35a3ab">
    <circle cx="812" cy="78" r="7"/>
    <circle cx="812" cy="142" r="7"/>
    <circle cx="812" cy="238" r="7"/>
    <circle cx="812" cy="334" r="7"/>
    <circle cx="812" cy="526" r="7"/>
    <circle cx="812" cy="638" r="7"/>
    <circle cx="812" cy="878" r="7"/>
  </g>
  <g font-size="25" fill="#1c3a5e">
    <text x="836" y="86">Configure plugins</text>
    <text x="836" y="150">Global policy and settings</text>
    <text x="836" y="246">Per-route policy definition</text>
    <text x="836" y="342">pre-invocation flow</text>
    <text x="836" y="534">post-invocation flow</text>
    <text x="836" y="646">field shaping (args/result)</text>
    <text x="836" y="886">session tainting</text>
  </g>

  <!-- effects legend -->
  <rect x="1250" y="330" width="780" height="480" rx="10" fill="#e9f2f3"/>
  <g font-family="IBM Plex Mono" font-size="22">
    <text x="1290" y="404"><tspan font-weight="600" fill="#161616">require(pred)</tspan><tspan fill="#5f5f5f" dx="13"># Boolean predicates</tspan></text>
    <text x="1290" y="472"><tspan font-weight="600" fill="#161616">pdp: {…}</tspan><tspan fill="#5f5f5f" dx="13"># PDP decision (Cedar, CEL, OPA)</tspan></text>
    <text x="1290" y="540"><tspan font-weight="600" fill="#161616">delegate(…)</tspan><tspan fill="#5f5f5f" dx="13"># token exchange (IdP)</tspan></text>
    <text x="1290" y="608"><tspan font-weight="600" fill="#161616">require_approval(…)</tspan><tspan fill="#5f5f5f" dx="13"># HIL approval (CIBA)</tspan></text>
    <text x="1290" y="676"><tspan font-weight="600" fill="#161616">run(plugin)</tspan><tspan fill="#5f5f5f" dx="13"># block, transform, observe</tspan></text>
    <text x="1290" y="744"><tspan font-weight="600" fill="#161616">taint(label, scope)</tspan><tspan fill="#5f5f5f" dx="13"># info-flow labels</tspan></text>
  </g>
</svg>
